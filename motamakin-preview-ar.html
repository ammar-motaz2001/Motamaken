<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مُتمكّن — معاينة الشاشات الناقصة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#178F4E; --green-2:#2E995C; --green-dark:#0F7A42;
  --green-tint:#EAF7F0; --green-line:#BFE3CE;
  --orange:#D24105;
  --ink:#141414; --ink-2:#5C5C5C; --ink-3:#8E8E8E;
  --line:#E4E4E4; --zebra:#F6F6F6; --bg:#FFFFFF;
  --shell:#0E1512; --shell-2:#17211D; --shell-line:#26332D;
  --r-s:8px; --r-m:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--shell);color:#E8EFEB;min-height:100vh}

/* ---------- shell ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 26px;border-bottom:1px solid var(--shell-line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:17px;font-weight:700}
.brand span{font-size:12.5px;color:#7E948B}
.note{font-size:12.5px;color:#7E948B;max-width:520px;line-height:1.7}
.note em{color:#8FD9B2;font-style:normal;font-weight:600}
.switch{display:flex;background:var(--shell-2);border:1px solid var(--shell-line);border-radius:9px;padding:3px;gap:3px}
.switch button{all:unset;cursor:pointer;padding:7px 17px;border-radius:7px;font-size:13px;font-weight:600;color:#8AA097;font-family:inherit}
.switch button[aria-pressed="true"]{background:var(--green);color:#fff}
.switch button:focus-visible{outline:2px solid #8FD9B2;outline-offset:2px}

.wrap{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 64px)}
.side{border-left:1px solid var(--shell-line);padding:18px 13px 40px;overflow:auto}
.grp{font-size:10.5px;letter-spacing:.1em;color:#5F7A6E;margin:18px 10px 7px;font-weight:700}
.grp:first-child{margin-top:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 11px;border-radius:8px;font-size:13.5px;color:#B7C7C0;display:flex;align-items:center;gap:9px;font-family:inherit}
.nav button:hover{background:var(--shell-2);color:#fff}
.nav button[aria-current="true"]{background:var(--green);color:#fff;font-weight:600}
.nav button:focus-visible{outline:2px solid #8FD9B2;outline-offset:2px}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.5;flex:none}

.stage{display:flex;flex-direction:column;align-items:center;padding:28px 20px 60px;gap:14px}
.caption{text-align:center;max-width:680px}
.caption h2{font-size:18px;font-weight:700}
.caption p{font-size:13.5px;color:#8AA097;margin-top:6px;line-height:1.8}

/* ---------- devices ---------- */
.phone{width:375px;height:812px;background:var(--bg);border-radius:34px;overflow:hidden;position:relative;
  box-shadow:0 0 0 9px #0A0F0D,0 0 0 10px #2B3833,0 24px 56px rgba(0,0,0,.5);flex:none}
.laptop{width:100%;max-width:1080px;height:720px;background:var(--bg);border-radius:12px;overflow:hidden;
  box-shadow:0 0 0 8px #0A0F0D,0 0 0 9px #2B3833,0 24px 56px rgba(0,0,0,.5)}
.screen{height:100%;overflow-y:auto;color:var(--ink);scrollbar-width:thin;background:#fff}
.screen::-webkit-scrollbar{width:6px}
.screen::-webkit-scrollbar-thumb{background:#D6D6D6;border-radius:4px}

/* ---------- mobile chrome ---------- */
.status{display:flex;justify-content:space-between;padding:12px 20px 4px;font-size:13px;font-weight:600}
.appbar{display:flex;align-items:center;gap:12px;padding:10px 16px 12px}
.appbar .back{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:600;flex:1}
.chev{font-size:17px;color:var(--ink-2)}
.icons{display:flex;align-items:center;gap:11px}
.ic{width:19px;height:19px;color:var(--ink-2);position:relative;display:grid;place-items:center;font-size:14px}
.badge{position:absolute;top:-5px;left:-5px;background:var(--orange);color:#fff;font-size:8.5px;font-weight:700;
  width:13px;height:13px;border-radius:50%;display:grid;place-items:center}
.grid-btn{width:27px;height:27px;border-radius:7px;background:var(--orange);display:grid;place-items:center;color:#fff;font-size:13px}
.searchrow{display:flex;gap:9px;padding:0 16px 14px}
.search{flex:1;border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;font-size:12.5px;color:var(--ink-3);
  display:flex;align-items:center;justify-content:space-between}
.cta{background:linear-gradient(180deg,var(--green-2),var(--green));color:#fff;border-radius:var(--r-s);
  padding:10px 15px;font-size:12.5px;font-weight:600;white-space:nowrap;display:grid;place-items:center}
.tabbar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;
  align-items:center;padding:9px 8px 13px}
.tabbar div{font-size:9.5px;color:var(--ink-3);text-align:center;display:flex;flex-direction:column;gap:3px;align-items:center}
.tabbar div.on{color:var(--green);font-weight:600}
.tabbar .plus{width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,var(--green-2),var(--green));
  color:#fff;display:grid;place-items:center;font-size:20px;margin-top:-20px;box-shadow:0 5px 14px rgba(23,143,78,.4)}

/* ---------- web chrome ---------- */
.webhead{border-bottom:1px solid var(--line);padding:14px 30px;display:flex;align-items:center;gap:22px;position:sticky;top:0;background:#fff;z-index:5}
.logo{font-weight:700;font-size:17px;color:var(--green);white-space:nowrap}
.logo small{display:block;font-size:9px;color:var(--ink-3);font-weight:400;letter-spacing:2px}
.webnav{display:flex;gap:20px;font-size:13.5px;color:var(--ink-2);font-weight:500}
.webnav span.on{color:var(--green);font-weight:600}
.websearch{flex:1;max-width:320px;border:1px solid var(--line);border-radius:var(--r-s);padding:9px 12px;font-size:12.5px;
  color:var(--ink-3);display:flex;justify-content:space-between;margin-right:auto}
.webpage{padding:24px 30px 40px;max-width:1080px}
.crumb{font-size:12px;color:var(--ink-3);margin-bottom:12px}
.cols{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
.cols-1{display:block}
.panel{border:1px solid var(--line);border-radius:12px;padding:18px}

/* ---------- shared ui ---------- */
.page{padding:4px 16px 26px}
.h1{font-size:19px;font-weight:700}
.sub{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.sec{margin-top:18px}
.sec-t{font-size:14px;font-weight:700;margin-bottom:9px}
.btn{display:block;width:100%;text-align:center;border-radius:var(--r-s);padding:12px;font-size:13.5px;font-weight:600;cursor:pointer;border:0;font-family:inherit}
.btn-p{background:linear-gradient(180deg,var(--green-2),var(--green));color:#fff}
.btn-o{background:#fff;border:1px solid var(--green-line);color:var(--green)}
.btn-g{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.btn+.btn{margin-top:9px}
.btn:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.row2{display:flex;gap:9px}
.row2 .btn{margin-top:0}
.card{border:1px solid var(--line);border-radius:var(--r-m);padding:13px;background:#fff}
.card+.card{margin-top:10px}
.flex{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.av{width:38px;height:38px;border-radius:50%;background:var(--green-tint);color:var(--green);display:grid;place-items:center;
  font-weight:700;font-size:12px;flex:none;border:1px solid var(--green-line)}
.av.o{background:#FCEDE7;border-color:#F3CDBD;color:var(--orange)}
.av.g{background:#F0F0F0;border-color:var(--line);color:var(--ink-2)}
.nm{font-size:13.5px;font-weight:600;line-height:1.5}
.mt{font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.7}
.pill{font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap;display:inline-block}
.p-green{background:var(--green-tint);color:var(--green)}
.p-orange{background:#FCEDE7;color:var(--orange)}
.p-grey{background:#F0F0F0;color:var(--ink-2)}
.p-blue{background:#E8EEFB;color:#28438F}
.field{margin-bottom:13px}
.lbl{font-size:12px;font-weight:600;margin-bottom:6px;display:block}
.inp{width:100%;border:1px solid var(--line);border-radius:var(--r-s);padding:11px 12px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff}
.inp::placeholder{color:var(--ink-3)}
.inp:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(23,143,78,.11)}
textarea.inp{min-height:78px;resize:none}
.hint{font-size:11px;color:var(--ink-3);margin-top:5px;line-height:1.7}
.bar{height:6px;background:#EDEDED;border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green-2),var(--green));border-radius:20px;transition:width .35s ease}
.ms{border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.ms+.ms{margin-top:10px}
.ms-h{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:var(--zebra);gap:8px}
.ms-b{padding:12px 13px}
.ms-n{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.ms-n.idle{background:#DADADA}
.chat{padding:14px 16px;display:flex;flex-direction:column;gap:11px}
.msg{max-width:76%;padding:9px 12px;border-radius:13px;font-size:12.5px;line-height:1.75}
.msg.them{background:var(--zebra);border-top-right-radius:4px;align-self:flex-start}
.msg.me{background:var(--green);color:#fff;border-top-left-radius:4px;align-self:flex-end}
.msg .who{font-size:10.5px;font-weight:700;color:var(--green);margin-bottom:3px}
.msg .tm{font-size:9.5px;opacity:.65;margin-top:4px;text-align:left}
.file{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;max-width:80%;align-self:flex-start}
.file .ico{width:32px;height:32px;border-radius:7px;background:var(--green-tint);color:var(--green);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.daysep{text-align:center;font-size:10.5px;color:var(--ink-3)}
.typing{font-size:11px;color:var(--ink-3)}
.composer{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:9px;align-items:center}
.composer .inp{border-radius:20px;padding:9px 14px}
.send{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none;font-size:15px;transform:scaleX(-1)}
.tb{width:100%;border-collapse:collapse;font-size:11.5px}
.tb th{text-align:right;font-weight:700;padding:9px 8px;border-bottom:1px solid var(--line)}
.tb td{padding:9px 8px;color:var(--ink-2);vertical-align:top;line-height:1.7}
.tb tr:nth-child(even) td{background:var(--zebra)}
.empty{text-align:center;padding:34px 14px}
.empty .ring{width:64px;height:64px;border-radius:50%;background:var(--green-tint);border:1px solid var(--green-line);
  display:grid;place-items:center;margin:0 auto 14px;font-size:24px;color:var(--green)}
.empty h3{font-size:15px;font-weight:700}
.empty p{font-size:12.5px;color:var(--ink-2);margin:6px 0 16px;line-height:1.8}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{font-size:13px;font-weight:600;color:var(--ink-3);padding-bottom:9px;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--orange)}
.opt{border:1px solid var(--line);border-radius:var(--r-m);padding:13px;cursor:pointer;display:flex;gap:11px;align-items:flex-start}
.opt+.opt{margin-top:10px}
.opt.on{border-color:var(--green);background:var(--green-tint)}
.rd{width:18px;height:18px;border-radius:50%;border:2px solid #CFCFCF;flex:none;margin-top:2px;display:grid;place-items:center}
.opt.on .rd{border-color:var(--green)}
.opt.on .rd::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--green)}
.divider{height:1px;background:var(--line);margin:15px 0}
.convlist{border-left:1px solid var(--line);overflow:auto}
.convrow{padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer}
.convrow.on{background:var(--green-tint)}
.webchat{display:grid;grid-template-columns:300px 1fr;height:100%}

@media (max-width:1000px){
  .wrap{grid-template-columns:1fr}
  .side{border-left:0;border-bottom:1px solid var(--shell-line)}
  .nav{flex-direction:row;flex-wrap:wrap}
  .cols{grid-template-columns:1fr}
  .webchat{grid-template-columns:1fr}
  .convlist{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="top">
  <div class="brand"><b>مُتمكّن</b><span>معاينة الشاشات الناقصة</span></div>
  <p class="note">هذه الشاشات لا يوجد لها تصميم في الملفات الحالية. مبنيّة <em>بالكود لا كصور</em> — كل لون وخط ومسافة مقروء من نظام التصميم القائم، فما تضغطه هنا هو ما سيُسلَّم.</p>
  <div class="switch">
    <button id="bMobile" aria-pressed="true">موبايل</button>
    <button id="bWeb" aria-pressed="false">ويب</button>
  </div>
</div>

<div class="wrap">
  <aside class="side">
    <div class="grp">فرق العمل</div><nav class="nav" id="nav1"></nav>
    <div class="grp">المحادثات</div><nav class="nav" id="nav2"></nav>
    <div class="grp">الدفعات الجزئية</div><nav class="nav" id="nav3"></nav>
    <div class="grp">العقد</div><nav class="nav" id="nav4"></nav>
  </aside>
  <main class="stage">
    <div class="caption"><h2 id="capT"></h2><p id="capD"></p></div>
    <div id="device"></div>
  </main>
</div>

<script>
/* ================= chrome ================= */
const mobileChrome = (s) => `
<div class="screen">
<div class="status"><span>9:41</span><span>▮▮▮ ᯤ ▰</span></div>
<div class="appbar">
  <div class="back"><span class="chev">›</span>${s.crumb}</div>
  <div class="icons"><span class="ic">☾</span><span class="ic">♡</span>
  <span class="ic">🔔<span class="badge">1</span></span><span class="grid-btn">⠿</span><span class="ic">☰</span></div>
</div>
<div class="searchrow"><div class="search"><span>ابحث</span><span>⌕</span></div>
<div class="cta">أضف طلبك المجاني</div></div>
<div class="page"><div class="h1">${s.title}</div><div class="sub">${s.sub}</div>${s.body}</div>
<div class="tabbar">
  <div><span>⌂</span>الرئيسية</div><div><span>▦</span>الأقسام</div>
  <div class="plus">+</div><div><span>⛁</span>طلباتي</div><div class="on"><span>☺</span>حسابي</div>
</div></div>`;

const webChrome = (s) => `
<div class="screen">
<div class="webhead">
  <div class="logo">MOTAMAKIN<small>مـتـمـكـن</small></div>
  <div class="webnav"><span>الرئيسية</span><span>المشاريع</span><span>المؤثرون</span><span class="on">حسابي</span></div>
  <div class="websearch"><span>ابحث</span><span>⌕</span></div>
  <div class="cta">أضف طلبك المجاني</div>
  <div class="icons"><span class="ic">♡</span><span class="ic">🔔<span class="badge">1</span></span><div class="av g">HA</div></div>
</div>
<div class="webpage">
  <div class="crumb">${s.crumb} › <span style="color:var(--ink-2)">${s.title}</span></div>
  <div class="h1" style="font-size:23px">${s.title}</div><div class="sub">${s.sub}</div>
  <div class="${s.web1?'cols-1':'cols'}" style="margin-top:20px">
    <div>${s.body}</div>
    ${s.web1?'':`<aside class="panel">${s.aside||defaultAside}</aside>`}
  </div>
</div></div>`;

const defaultAside = `
<div class="sec-t">ملخص التعاقد</div>
<div class="between" style="margin-bottom:9px"><span class="mt">المشروع</span><span class="nm" style="font-size:12.5px">لوحة تحكم تفاعلية</span></div>
<div class="between" style="margin-bottom:9px"><span class="mt">القيمة</span><span class="nm" style="font-size:12.5px">1,200 $</span></div>
<div class="between" style="margin-bottom:9px"><span class="mt">نمط الدفع</span><span class="nm" style="font-size:12.5px">ثلاث مراحل</span></div>
<div class="divider"></div>
<div class="between" style="margin-bottom:7px"><span class="mt">المصروف حتى الآن</span><b style="font-size:12.5px">240 $</b></div>
<div class="bar"><i style="width:20%"></i></div>
<div class="hint">الباقي محجوز داخل المنصة ولا يملكه أي طرف حتى اعتماد مرحلته.</div>`;

/* ================= screens ================= */
const S = {
teams_empty:{g:1,label:'الفرق — لا يوجد فريق',crumb:'حسابي',title:'فرقي',sub:'كوّن فريقاً لتنفيذ المشاريع الكبيرة',
 cap:'فرق العمل · الحالة الفارغة',
 desc:'كل قائمة تحتاج حالة أولى. الشاشة الفارغة دعوة للتصرف، فهي تشرح فائدة الفريق وتعرض الإجراء الوحيد المهم.',
 web1:true,
 body:`<div class="empty"><div class="ring">⚇</div>
  <h3>لا توجد فرق بعد</h3>
  <p>كوّن فريقاً لتوزيع مشروع كبير على أكثر من منفّذ، ومشاركة الملفات، وإبقاء محادثة واحدة تجمع الجميع.</p>
  <div style="max-width:300px;margin:0 auto">
  <button class="btn btn-p">إنشاء فريق</button>
  <button class="btn btn-o">كيف تعمل الفرق؟</button></div></div>`},

teams_list:{g:1,label:'قائمة الفرق',crumb:'حسابي',title:'فرقي',sub:'فريقان · مشروع واحد جارٍ',
 cap:'فرق العمل · القائمة',
 desc:'كل صف يجيب على ثلاثة أسئلة دفعة واحدة: من في الفريق، وما دورك فيه، وهل هو مرتبط بعمل قائم.',
 body:`<div class="card">
  <div class="between"><div class="flex"><div class="av">لت</div>
    <div><div class="nm">فريق لوحات التحكم</div><div class="mt">4 أعضاء · أنت المالك</div></div></div>
    <span class="pill p-green">نشط</span></div>
  <div class="divider"></div>
  <div class="between"><span class="mt">لوحة تحكم تفاعلية — Excel</span><span class="mt">1,200 $</span></div></div>
 <div class="card">
  <div class="between"><div class="flex"><div class="av o">هب</div>
    <div><div class="nm">فريق الهوية البصرية</div><div class="mt">3 أعضاء · عضو</div></div></div>
    <span class="pill p-grey">خامل</span></div>
  <div class="divider"></div>
  <div class="between"><span class="mt">لا يوجد مشروع مرتبط</span><span class="mt">—</span></div></div>
 <div class="sec"><button class="btn btn-p">إنشاء فريق</button></div>`},

teams_create:{g:1,label:'إنشاء فريق',crumb:'فرقي',title:'إنشاء فريق',sub:'سمِّه، ثم ادعُ من تحتاجهم',
 cap:'فرق العمل · الإنشاء',
 desc:'ثلاثة حقول فقط. ما يستطيع المالك تغييره لاحقاً لا مكان له في خطوة الإنشاء.',
 body:`<div class="field"><label class="lbl">اسم الفريق</label>
   <input class="inp" value="فريق لوحات التحكم"></div>
 <div class="field"><label class="lbl">ماذا يعمل هذا الفريق</label>
   <textarea class="inp">تصميم لوحات البيانات والتقارير.</textarea></div>

    <div class="cta">أضف طلبك المجاني</div></div>
  <div class="webchat" style="height:calc(100% - 62px)">
    <div class="convlist">
      <div class="convrow ${s===S.chat_group?'on':''}"><div class="flex"><div class="av">لت</div>
        <div><div class="nm">فريق لوحات التحكم</div><div class="mt">مريم: رفعت النسخة المعدّلة</div></div></div></div>
      <div class="convrow ${s===S.chat_direct?'on':''}"><div class="flex"><div class="av o">حع</div>
        <div><div class="nm">حسام عمار</div><div class="mt">هل يمكن تأجيل المرحلة الثانية؟</div></div></div></div>
      <div class="convrow"><div class="flex"><div class="av g">نف</div>
        <div><div class="nm">نور فتحي</div><div class="mt">أنت: أرسلت الملفات النهائية</div></div></div></div>
    </div>
    <div style="display:flex;flex-direction:column;overflow:hidden">
      <div style="padding:13px 20px;border-bottom:1px solid var(--line)">
        <div class="nm">${s.title}</div><div class="mt">${s.sub}</div></div>
      <div style="flex:1;overflow:auto">${s.body}</div>
    </div></div></div>`;
}

function show(k){
  current=k; const s=S[k];
  const host=document.getElementById('device');
  if(view==='mobile'){
    host.className='phone'; host.innerHTML=mobileChrome(s);
  } else {
    host.className='laptop';
    host.innerHTML = s.chat ? webChatLayout(s) : webChrome(s);
  }
  document.getElementById('capT').textContent=s.cap;
  document.getElementById('capD').textContent=s.desc;
  document.querySelectorAll('.nav button').forEach(b=>
    b.setAttribute('aria-current', b.dataset.k===k?'true':'false'));
  wire();
}

document.getElementById('bMobile').onclick=()=>setView('mobile');
document.getElementById('bWeb').onclick=()=>setView('web');
function setView(v){
  view=v;
  document.getElementById('bMobile').setAttribute('aria-pressed',v==='mobile');
  document.getElementById('bWeb').setAttribute('aria-pressed',v==='web');
  show(current);
}

function wire(){
  document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    o.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));
    o.classList.add('on');});
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    t.parentNode.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');});
  const pcts=document.querySelectorAll('.pct');
  if(!pcts.length) return;
  const recalc=()=>{
    let total=0; pcts.forEach(p=>total+=Number(p.value)||0);
    const amts=document.querySelectorAll('.msamt');
    pcts.forEach((p,i)=>{if(amts[i]) amts[i].textContent=Math.round(1200*(Number(p.value)||0)/100)+' $';});
    const tot=document.getElementById('tot'),bar=document.getElementById('totbar'),
          hint=document.getElementById('tothint'),btn=document.getElementById('msSend');
    tot.textContent=total+'٪'; bar.style.width=Math.min(total,100)+'%';
    const ok=total===100;
    tot.style.color=ok?'var(--green)':'var(--orange)';
    bar.style.background=ok?'':'var(--orange)';
    hint.textContent = ok?'متوازن. يمكنك إرسال هذا التقسيم للمنفّذ.'
      : total<100 ? 'باقي '+(100-total)+'٪ من قيمة العقد غير موزّعة.'
                  : 'تجاوزت بمقدار '+(total-100)+'٪. قلّل نسبة إحدى المراحل قبل الإرسال.';
    btn.style.opacity=ok?'1':'.45'; btn.style.pointerEvents=ok?'auto':'none';
  };
  pcts.forEach(p=>p.addEventListener('input',recalc)); recalc();
}

show('teams_empty');
</script>
</body>
</html>
